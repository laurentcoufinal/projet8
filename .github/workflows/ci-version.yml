name: CI

on:
  workflow_dispatch:
    inputs:
      java_version:
        description: "Version Java (ex: 21)"
        required: true
        default: "21"
        type: string
      node_version:
        description: "Version Node.js (ex: 22)"
        required: true
        default: "22"
        type: string

permissions:
  contents: read
  checks: write
  packages: write

env:
  JAVA_DIR: java/G-rez-l-int-gration-et-la-livraison-continue-Application-Java
  ANGULAR_DIR: angular/G-rez-l-int-gration-et-la-livraison-continue-Application-Angular
  TEST_RESULTS_DIR: test-results

jobs:
  detect:
    name: Détection des projets
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.java_version || '21' }}
      NODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.node_version || '22' }}
    outputs:
      has_java: ${{ steps.detect.outputs.has_java }}
      has_angular: ${{ steps.detect.outputs.has_angular }}
      java_version: ${{ steps.meta.outputs.java_version }}
      node_version: ${{ steps.meta.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions (workflow_dispatch / défauts)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "java_version=${JAVA_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "node_version=${NODE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Detect project types
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          has_java=false
          has_angular=false

          if [[ -f "${JAVA_DIR}/build.gradle" && -x "${JAVA_DIR}/gradlew" ]]; then
            has_java=true
          fi
          if [[ -f "${ANGULAR_DIR}/package.json" ]]; then
            has_angular=true
          fi

          # #region agent log
          mkdir -p .cursor
          _ts=$(($(date +%s) * 1000))
          _jbg=false; [[ -f "${JAVA_DIR}/build.gradle" ]] && _jbg=true
          _jgx=false; [[ -x "${JAVA_DIR}/gradlew" ]] && _jgx=true
          _apk=false; [[ -f "${ANGULAR_DIR}/package.json" ]] && _apk=true
          printf '%s\n' "{\"sessionId\":\"686be6\",\"runId\":\"${GITHUB_RUN_ID:-local}\",\"hypothesisId\":\"H1\",\"location\":\"ci.yml:Detect project types\",\"message\":\"detection après checkout\",\"data\":{\"has_java\":\"${has_java}\",\"has_angular\":\"${has_angular}\",\"java_build_gradle\":\"${_jbg}\",\"java_gradlew_exec\":\"${_jgx}\",\"angular_package_json\":\"${_apk}\"},\"timestamp\":${_ts}}" >> ".cursor/debug-686be6.log" || true
          # #endregion

          echo "has_java=${has_java}" >> "${GITHUB_OUTPUT}"
          echo "has_angular=${has_angular}" >> "${GITHUB_OUTPUT}"

      - name: Fail if no supported project found
        if: steps.detect.outputs.has_java != 'true' && steps.detect.outputs.has_angular != 'true'
        run: |
          echo "Aucun projet Java ou Angular détecté avec la convention attendue." >&2
          exit 1

  test-java:
    name: Tests Java (Gradle)
    needs: detect
    if: needs.detect.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.detect.outputs.java_version }}
          cache: gradle

      - name: Prepare test-results (Java)
        run: |
          rm -rf "${{ env.TEST_RESULTS_DIR }}/java"
          mkdir -p "${{ env.TEST_RESULTS_DIR }}/java"

      - name: Run Java tests
        working-directory: ${{ env.JAVA_DIR }}
        run: ./gradlew clean test

      - name: Collect Java JUnit XML reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src="${{ env.JAVA_DIR }}/build/test-results/test"
          if [[ -d "${src}" ]]; then
            shopt -s nullglob
            files=("${src}"/*.xml)
            shopt -u nullglob
            if ((${#files[@]})); then
              cp "${files[@]}" "${{ env.TEST_RESULTS_DIR }}/java/"
            fi
          fi

      - name: Upload JUnit (Java)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-java
          path: ${{ env.TEST_RESULTS_DIR }}/java
          if-no-files-found: warn

  test-angular:
    name: Tests Angular (npm / Karma)
    needs: detect
    if: needs.detect.outputs.has_angular == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.detect.outputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ env.ANGULAR_DIR }}/package-lock.json

      - name: Prepare test-results (Angular)
        run: |
          rm -rf "${{ env.TEST_RESULTS_DIR }}/angular"
          mkdir -p "${{ env.TEST_RESULTS_DIR }}/angular"

      - name: Install Angular dependencies
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm ci

      - name: Run Angular tests
        working-directory: ${{ env.ANGULAR_DIR }}
        env:
          KARMA_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/${{ env.TEST_RESULTS_DIR }}/angular
        run: npm test

      - name: Collect Angular JUnit XML reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ env.TEST_RESULTS_DIR }}/angular"
          mkdir -p "${dest}"
          # Source unique: rapports Karma dans le projet Angular.
          src="${{ env.ANGULAR_DIR }}/reports"
          if [[ -d "${src}" ]]; then
            shopt -s nullglob
            files=("${src}"/*.xml)
            shopt -u nullglob
            if ((${#files[@]})); then
              cp "${files[@]}" "${dest}/"
            fi
          fi

      - name: Upload JUnit (Angular)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-angular
          path: ${{ env.TEST_RESULTS_DIR }}/angular
          if-no-files-found: warn

  report-tests:
    name: Rapport JUnit (GitHub Checks)
    needs: [detect, test-java, test-angular]
    if: always() && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare report directories
        env:
          JAVA_STAGING: ${{ runner.temp }}/junit-java
          ANGULAR_STAGING: ${{ runner.temp }}/junit-angular
        run: |
          rm -rf test-results/
          mkdir -p test-results/java test-results/angular
          rm -rf "${JAVA_STAGING}" "${ANGULAR_STAGING}"
          mkdir -p "${JAVA_STAGING}" "${ANGULAR_STAGING}"

      - name: Download JUnit (Java)
        if: needs.detect.outputs.has_java == 'true' && needs.test-java.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-xml-java
          path: ${{ runner.temp }}/junit-java

      - name: Download JUnit (Angular)
        if: needs.detect.outputs.has_angular == 'true' && needs.test-angular.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-xml-angular
          path: ${{ runner.temp }}/junit-angular

      - name: Stage downloaded JUnit reports
        if: always()
        env:
          JAVA_STAGING: ${{ runner.temp }}/junit-java
          ANGULAR_STAGING: ${{ runner.temp }}/junit-angular
        shell: bash
        run: |
          set -euo pipefail
          stage_junit_xml() {
            local src="$1"
            local dest="$2"
            mkdir -p "${dest}"
            [[ -d "${src}" ]] || return 0
            while IFS= read -r -d '' f; do
              local base target
              base=$(basename "$f")
              target="${dest}/${base}"
              if [[ -f "${target}" ]] && [[ "$(realpath "$f")" == "$(realpath "${target}")" ]]; then
                continue
              fi
              cp "$f" "${target}"
            done < <(find "${src}" -name '*.xml' -print0)
          }
          stage_junit_xml "${JAVA_STAGING}" "test-results/java"
          stage_junit_xml "${ANGULAR_STAGING}" "test-results/angular"

      - name: Upload test XML artifacts (agrégé)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-reports
          path: test-results/
          if-no-files-found: warn

      - name: Publish JUnit report in GitHub UI
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: CI - Test report

  docker-images:
    name: Images Docker (build / push)
    needs: [detect, test-java, test-angular]
    if: ${{ always() && needs.detect.result == 'success' && (needs.test-java.result == 'success' || needs.test-java.result == 'skipped') && (needs.test-angular.result == 'success' || needs.test-angular.result == 'skipped') && needs.test-java.result != 'failure' && needs.test-angular.result != 'failure' && github.event_name != 'pull_request' && (needs.detect.outputs.has_java == 'true' || needs.detect.outputs.has_angular == 'true') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub credentials check
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_ENVIRONMENT_NAME: ${{ github.environment }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cursor
          ready=false
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            ready=true
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

          # #region agent log
          _ts=$(($(date +%s) * 1000))
          _u=no
          [[ -n "${DOCKERHUB_USERNAME:-}" ]] && _u=yes
          _t=no
          [[ -n "${DOCKERHUB_TOKEN:-}" ]] && _t=yes
          printf '%s\n' "{\"sessionId\":\"686be6\",\"runId\":\"${GITHUB_RUN_ID:-local}\",\"hypothesisId\":\"H2\",\"location\":\"ci.yml:Docker Hub credentials check\",\"message\":\"secrets presence (no values)\",\"data\":{\"username_nonempty\":\"${_u}\",\"token_nonempty\":\"${_t}\",\"ready\":\"${ready}\",\"event\":\"${GITHUB_EVENT_NAME}\",\"github_environment\":\"${GITHUB_ENVIRONMENT_NAME}\"},\"timestamp\":${_ts}}" >> ".cursor/debug-686be6.log" || true
          # #endregion

          if [[ "${ready}" != "true" ]]; then
            echo "::warning::Push Docker Hub ignoré : définir DOCKERHUB_USERNAME et DOCKERHUB_TOKEN dans l'environnement GitHub Actions « dev » (ce job utilise environment: dev) ou en secrets de dépôt." >&2
          fi

      - name: Setup Docker Buildx
        if: needs.detect.outputs.has_java == 'true' || needs.detect.outputs.has_angular == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Référentiel GHCR (minuscules)
        id: ghcr
        if: needs.detect.outputs.has_java == 'true' || needs.detect.outputs.has_angular == 'true'
        shell: bash
        run: |
          set -euo pipefail
          r=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "repository=${r}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        if: needs.detect.outputs.has_java == 'true' || needs.detect.outputs.has_angular == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags image Java (GHCR + Docker Hub optionnel)
        id: tags_java
        if: needs.detect.outputs.has_java == 'true'
        env:
          REPO_LOWER: ${{ steps.ghcr.outputs.repository }}
          DOCKERHUB_READY: ${{ steps.dockerhub.outputs.ready }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${REPO_LOWER}:java-${GITHUB_SHA}"
            echo "ghcr.io/${REPO_LOWER}:java-latest"
          } > /tmp/java-tags.txt
          if [[ "${DOCKERHUB_READY}" == "true" ]]; then
            echo "laurentcoufinal/projet8:java-${GITHUB_SHA}" >> /tmp/java-tags.txt
            echo "laurentcoufinal/projet8:java-latest" >> /tmp/java-tags.txt
          fi
          {
            echo "tags<<EOF"
            cat /tmp/java-tags.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Tags image Angular (GHCR + Docker Hub optionnel)
        id: tags_angular
        if: needs.detect.outputs.has_angular == 'true'
        env:
          REPO_LOWER: ${{ steps.ghcr.outputs.repository }}
          DOCKERHUB_READY: ${{ steps.dockerhub.outputs.ready }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${REPO_LOWER}:angular-${GITHUB_SHA}"
            echo "ghcr.io/${REPO_LOWER}:angular-latest"
          } > /tmp/angular-tags.txt
          if [[ "${DOCKERHUB_READY}" == "true" ]]; then
            echo "laurentcoufinal/projet8:angular-${GITHUB_SHA}" >> /tmp/angular-tags.txt
            echo "laurentcoufinal/projet8:angular-latest" >> /tmp/angular-tags.txt
          fi
          {
            echo "tags<<EOF"
            cat /tmp/angular-tags.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Java image
        if: needs.detect.outputs.has_java == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/java.Dockerfile
          push: true
          tags: ${{ steps.tags_java.outputs.tags }}

      - name: Build and push Angular image
        if: needs.detect.outputs.has_angular == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/angular.Dockerfile
          push: true
          tags: ${{ steps.tags_angular.outputs.tags }}
