name: Test Angular

on:
  workflow_call:
    inputs:
      project_dir:
        type: string
        required: true
      node_version:
        type: string
        required: true
      test_results_dir:
        type: string
        required: true
      package_lock_path:
        type: string
        required: true

jobs:
  test-angular:
    name: Tests Angular (npm / Karma)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.package_lock_path }}

      - name: Prepare test-results (Angular)
        run: |
          rm -rf "${{ inputs.test_results_dir }}/angular"
          mkdir -p "${{ inputs.test_results_dir }}/angular"

      - name: Install Angular dependencies
        working-directory: ${{ inputs.project_dir }}
        run: npm ci

      - name: Run Angular tests
        working-directory: ${{ inputs.project_dir }}
        env:
          KARMA_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/${{ inputs.test_results_dir }}/angular
        run: npm test

      - name: Collect Angular JUnit XML reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ inputs.test_results_dir }}/angular"
          mkdir -p "${dest}"
          # Source unique: rapports Karma dans le projet Angular.
          src="${{ inputs.project_dir }}/reports"
          if [[ -d "${src}" ]]; then
            shopt -s nullglob
            files=("${src}"/*.xml)
            shopt -u nullglob
            if ((${#files[@]})); then
              cp "${files[@]}" "${dest}/"
            fi
          fi
          # #region agent log
          _ts=$(($(date +%s) * 1000))
          _n=0
          shopt -s nullglob
          _files=("${dest}"/*.xml)
          shopt -u nullglob
          _n=${#_files[@]}
          mkdir -p .cursor
          printf '%s\n' "{\"sessionId\":\"af93e2\",\"runId\":\"${GITHUB_RUN_ID}\",\"hypothesisId\":\"H5\",\"location\":\"test-angular.yml:Collect\",\"message\":\"xml files collected\",\"data\":{\"dest\":\"${dest}\",\"xml_count\":${_n}},\"timestamp\":${_ts}}" >> ".cursor/debug-af93e2.log" || true
          # #endregion

      - name: Upload JUnit (Angular)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-angular
          path: ${{ inputs.test_results_dir }}/angular
          if-no-files-found: warn
