name: Report tests

on:
  workflow_call:
    inputs:
      has_java:
        type: string
        required: true
      has_angular:
        type: string
        required: true
      check_name:
        type: string
        required: false
        default: CI - Test report
      test_java_result:
        type: string
        required: false
        default: skipped
      test_angular_result:
        type: string
        required: false
        default: skipped

jobs:
  report-tests:
    name: Rapport JUnit (GitHub Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Prepare report directories
        env:
          JAVA_STAGING: ${{ runner.temp }}/junit-java
          ANGULAR_STAGING: ${{ runner.temp }}/junit-angular
        run: |
          rm -rf test-results/
          mkdir -p test-results/java test-results/angular
          rm -rf "${JAVA_STAGING}" "${ANGULAR_STAGING}"
          mkdir -p "${JAVA_STAGING}" "${ANGULAR_STAGING}"

      - name: Download JUnit (Java)
        if: inputs.has_java == 'true' && inputs.test_java_result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-xml-java
          path: ${{ runner.temp }}/junit-java

      - name: Download JUnit (Angular)
        if: inputs.has_angular == 'true' && inputs.test_angular_result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-xml-angular
          path: ${{ runner.temp }}/junit-angular

      - name: Stage downloaded JUnit reports
        if: always()
        env:
          JAVA_STAGING: ${{ runner.temp }}/junit-java
          ANGULAR_STAGING: ${{ runner.temp }}/junit-angular
        shell: bash
        run: |
          set -euo pipefail
          stage_junit_xml() {
            local src="$1"
            local dest="$2"
            mkdir -p "${dest}"
            [[ -d "${src}" ]] || return 0
            while IFS= read -r -d '' f; do
              local base target
              base=$(basename "$f")
              target="${dest}/${base}"
              if [[ -f "${target}" ]] && [[ "$(realpath "$f")" == "$(realpath "${target}")" ]]; then
                continue
              fi
              cp "$f" "${target}"
            done < <(find "${src}" -name '*.xml' -print0)
          }
          stage_junit_xml "${JAVA_STAGING}" "test-results/java"
          stage_junit_xml "${ANGULAR_STAGING}" "test-results/angular"

      - name: Upload test XML artifacts (agrégé)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-reports
          path: test-results/
          if-no-files-found: warn

      - name: Publish JUnit report in GitHub UI
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: ${{ inputs.check_name }}
