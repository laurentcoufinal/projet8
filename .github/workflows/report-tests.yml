name: Report tests

on:
  workflow_call:
    inputs:
      has_java:
        type: string
        required: true
      has_angular:
        type: string
        required: true
      check_name:
        type: string
        required: false
        default: CI - Test report
      test_java_result:
        type: string
        required: false
        default: skipped
      test_angular_result:
        type: string
        required: false
        default: skipped

jobs:
  report-tests:
    name: Rapport JUnit (GitHub Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Prepare report directories
        run: |
          rm -rf test-results/ .ci-staging/
          mkdir -p test-results/java test-results/angular
          mkdir -p .ci-staging/java .ci-staging/angular

      - name: Download JUnit (Java)
        if: inputs.has_java == 'true' && inputs.test_java_result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-xml-java
          path: .ci-staging/java

      - name: Download JUnit (Angular)
        if: inputs.has_angular == 'true' && inputs.test_angular_result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-xml-angular
          path: .ci-staging/angular

      - name: Stage downloaded JUnit reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for stack in java angular; do
            src=".ci-staging/${stack}"
            dest="test-results/${stack}"
            mkdir -p "${dest}"
            if [[ -d "${src}" ]]; then
              find "${src}" -name '*.xml' -print0 | xargs -0 -r cp -t "${dest}"
            fi
          done

      - name: Upload test XML artifacts (agrégé)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-reports
          path: test-results/
          if-no-files-found: warn

      - name: Publish JUnit report in GitHub UI
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          check_name: ${{ inputs.check_name }}
